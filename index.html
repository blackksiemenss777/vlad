<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Ozon Dashboard v28</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#0d1117;
    color:#eaf0f8;
    font-family:Arial,sans-serif;
    padding:18px 22px 6px;
    min-height:auto;
}
.kpis{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
    margin-top:6px;
}
.card,.main,.cab{
    background:#151b24;
    border:1px solid #283243;
    border-radius:16px;
}
.card{
    padding:16px;
}
.label{
    color:#a2aec0;
    font-size:13px;
    margin-bottom:4px;
}
.value{
    font-size:28px;
    font-weight:700;
    line-height:1.1;
}
.main{
    margin-top:12px;
    padding:8px 12px 6px;
    height:310px;
    position:relative;
    overflow:visible;
}
.main-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
}
.main-title{
    font-size:14px;
    color:#d6deeb;
    font-weight:600;
}
.main-controls{
    display:flex;
    gap:8px;
    align-items:center;
}
select,button{
    background:#202938;
    color:#fff;
    border:1px solid #344052;
    border-radius:10px;
    padding:7px 12px;
    font-size:12px;
    font-weight:700;
}
button{
    cursor:pointer;
}
#total{
    width:100%;
    height:270px;
    display:block;
}
.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:10px;
}
.cab{
    height:235px;
    padding:16px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}
.cab-title{
    font-size:16px;
    font-weight:700;
    margin-bottom:10px;
}
.chart-wrap{
    flex:1;
    display:flex;
    align-items:center;
}
canvas.small{
    width:100%;
    height:55px;
    display:block;
}
.bottom-stats{
    border-top:1px solid #2b3545;
    padding-top:12px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:10px;
}
.metric{
    font-size:13px;
    color:#94a0b3;
}
.metric b{
    display:block;
    margin-top:4px;
    color:#fff;
    font-size:14px;
    font-weight:700;
}
@media(max-width:1400px){
    body{overflow:auto;height:auto}
    .grid{grid-template-columns:repeat(2,1fr)}
    .kpis{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<input id="file" type="file" accept=".xlsx" hidden>

<div class="kpis">
    <div class="card"><div class="label">GMV</div><div class="value" id="gmv">0 ₽</div></div>
    <div class="card"><div class="label">Реклама</div><div class="value" id="ads">0 ₽</div></div>
    <div class="card"><div class="label">ДРР</div><div class="value" id="drr">0%</div></div>
    <div class="card"><div class="label">Прибыль</div><div class="value" id="profit">0 ₽</div></div>
    <div class="card"><div class="label">Продано СС</div><div class="value" id="ss">0 ₽</div></div>
</div>

<div class="main">
    <div class="main-top">
        <div class="main-title" id="mainTitle">Общая динамика — GMV</div>
        <div class="main-controls">
            <select id="mainMetric">
                <option value="GMV">GMV</option>
                <option value="Реклама">Реклама</option>
                <option value="Прибыль">Прибыль</option>
                <option value="Продано_СС">Продано СС</option>
                <option value="ДРР">ДРР</option>
            </select>
            <button onclick="file.click()">Импорт отчёта</button>
        </div>
    </div>
    <canvas id="total"></canvas>
</div>

<div class="grid" id="grid"></div>

<script>
const names=["Avenue","Всё для праздника","Декор","Игрушки","Интерьер","Маркет","Мебель","Посуда и хозтовары","Спорт","Спорт и отдых","Спортивная одежда","Текстиль","Тепло и Уют","Товары для дома","Универсальный","Эксклюзивные товары"];
let currentRows = [];

function money(v){return Math.round(v||0).toLocaleString("ru-RU")+" ₽"}

function parseDate(v){
    if(typeof v==="number"){
        let d=XLSX.SSF.parse_date_code(v);
        return new Date(d.y,d.m-1,d.d);
    }
    let p=String(v).split(".");
    if(p.length===3)return new Date(p[2],p[1]-1,p[0]);
    return new Date(v);
}

function niceMax(value){
    if(!value || value <= 0) return 1_000_000;
    const units=[1_000_000,2_000_000,5_000_000,10_000_000,20_000_000,50_000_000,100_000_000,200_000_000,500_000_000,1_000_000_000];
    for(const u of units){ if(value<=u) return u; }
    const p=Math.pow(10,Math.floor(Math.log10(value)));
    return Math.ceil(value/p)*p;
}

function drawSmall(canvas, values){
    const ctx=canvas.getContext("2d");
    canvas.width=canvas.clientWidth*2;
    canvas.height=canvas.clientHeight*2;
    ctx.scale(2,2);

    const w=canvas.clientWidth, h=canvas.clientHeight;
    const frame = values.slice(0,30);
    while(frame.length < 30) frame.push(null);

    const valid = frame.filter(v => typeof v === "number" && !isNaN(v));
    if(valid.length < 2) return;

    const max=Math.max(...valid), min=Math.min(...valid), range=max-min||1;

    let started = false;
    let firstX = null, firstY = null, lastX = null;

    ctx.beginPath();
    frame.forEach((v,i)=>{
        if(v===null || v===undefined) return;
        const x=(i/29)*w;
        const y=h-((v-min)/range*(h*0.72)+h*0.12);
        if(!started){
            ctx.moveTo(x,y);
            firstX = x;
            firstY = y;
            started = true;
        }else{
            ctx.lineTo(x,y);
        }
        lastX = x;
    });

    if(started && lastX !== null){
        ctx.lineTo(lastX,h);
        ctx.lineTo(firstX,h);
        ctx.closePath();
        const grad=ctx.createLinearGradient(0,0,0,h);
        grad.addColorStop(0,"rgba(77,140,255,0.24)");
        grad.addColorStop(1,"rgba(77,140,255,0.02)");
        ctx.fillStyle=grad;
        ctx.fill();
    }

    started = false;
    ctx.beginPath();
    frame.forEach((v,i)=>{
        if(v===null || v===undefined) return;
        const x=(i/29)*w;
        const y=h-((v-min)/range*(h*0.72)+h*0.12);
        if(!started){
            ctx.moveTo(x,y);
            started = true;
        }else{
            ctx.lineTo(x,y);
        }
    });
    ctx.strokeStyle="#5ea0ff";
    ctx.lineWidth=1.8;
    ctx.stroke();
}

function drawMainChart(canvas, values, metricLabel){
    const ctx=canvas.getContext("2d");
    canvas.width=canvas.clientWidth*2;
    canvas.height=canvas.clientHeight*2;
    ctx.scale(2,2);

    const w=canvas.clientWidth, h=canvas.clientHeight;
    const padL=62, padR=12, padT=12, padB=45;
    const chartW=w-padL-padR, chartH=h-padT-padB;
    ctx.clearRect(0,0,w,h);

    const valid=values.filter(v=>typeof v==="number" && !isNaN(v));
    if(valid.length<2){
        ctx.strokeStyle="#263242";
        ctx.beginPath();
        ctx.moveTo(padL,padT+chartH);
        ctx.lineTo(padL+chartW,padT+chartH);
        ctx.stroke();
        return;
    }

    const isPercent = metricLabel === "ДРР";
    const maxVal = isPercent ? Math.max(20, Math.ceil(Math.max(...valid))) : niceMax(Math.max(...valid));
    const ySteps = 5;

    // grid and labels
    ctx.strokeStyle="#273242";
    ctx.lineWidth=1;
    ctx.fillStyle="#8792a6";
    ctx.font="11px Arial";
    ctx.textAlign="right";
    ctx.textBaseline="middle";

    for(let i=0;i<=ySteps;i++){
        const val = (maxVal / ySteps) * (ySteps - i);
        const y = padT + (chartH / ySteps) * i;
        ctx.beginPath();
        ctx.moveTo(padL,y);
        ctx.lineTo(padL+chartW,y);
        ctx.stroke();

        let label = "";
        if(isPercent){
            label = `${Math.round(val)}%`;
        }else{
            const mln = val / 1_000_000;
            label = mln >= 100 ? `${Math.round(mln)} млн` : `${mln.toFixed(mln % 1 === 0 ? 0 : 1)} млн`;
        }
        ctx.fillText(label, padL-8, y);
    }

    // x labels 1..30
    ctx.fillStyle="#7f8a9e";
    ctx.font="11px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    for(let i=1;i<=30;i++){
        const x = padL + ((i-1)/29)*chartW;
        ctx.fillText(String(i), x, padT + chartH + padB/2);
    }

    // area
    ctx.beginPath();
    values.forEach((v,i)=>{
        if(v===null || v===undefined) return;
        const x = padL + (i/29)*chartW;
        const y = padT + chartH - (Math.min(v,maxVal)/maxVal)*chartH;
        if(i===0 || values[i-1]===null || values[i-1]===undefined) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.lineTo(padL+chartW,padT+chartH);
    ctx.lineTo(padL,padT+chartH);
    ctx.closePath();
    const grad=ctx.createLinearGradient(0,padT,0,padT+chartH);
    grad.addColorStop(0,"rgba(77,140,255,0.28)");
    grad.addColorStop(1,"rgba(77,140,255,0.02)");
    ctx.fillStyle=grad;
    ctx.fill();

    // line
    ctx.beginPath();
    values.forEach((v,i)=>{
        if(v===null || v===undefined) return;
        const x = padL + (i/29)*chartW;
        const y = padT + chartH - (Math.min(v,maxVal)/maxVal)*chartH;
        if(i===0 || values[i-1]===null || values[i-1]===undefined) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.strokeStyle="#5ea0ff";
    ctx.lineWidth=2.1;
    ctx.stroke();
}

function metricLabel(key){
    if(key==="GMV") return "GMV";
    if(key==="Реклама") return "Реклама";
    if(key==="Прибыль") return "Прибыль";
    if(key==="Продано_СС") return "Продано СС";
    if(key==="ДРР") return "ДРР";
    return key;
}

function buildMainSeries(rows, metricKey){
    const perDate = {};
    rows.forEach(r=>{
        const dateKey = parseDate(r.Дата).toISOString().slice(0,10);
        if(!perDate[dateKey]) perDate[dateKey] = {gmv:0, ads:0, profit:0, ss:0};
        perDate[dateKey].gmv += Number(r.GMV||0);
        perDate[dateKey].ads += Number(r.Реклама||0);
        perDate[dateKey].profit += Number(r.Прибыль||0);
        perDate[dateKey].ss += Number(r.Продано_СС||0);
    });

    const orderedDates = Object.keys(perDate).sort();
    let values = orderedDates.map(d=>{
        if(metricKey==="GMV") return perDate[d].gmv;
        if(metricKey==="Реклама") return perDate[d].ads;
        if(metricKey==="Прибыль") return perDate[d].profit;
        if(metricKey==="Продано_СС") return perDate[d].ss;
        if(metricKey==="ДРР") return perDate[d].gmv ? (perDate[d].ads/perDate[d].gmv*100) : 0;
        return perDate[d].gmv;
    });

    values = values.slice(-30);
    while(values.length < 30) values.push(null);
    return values;
}

function drawMainFromSelector(){
    const key = document.getElementById("mainMetric").value;
    document.getElementById("mainTitle").textContent = "Общая динамика — " + metricLabel(key);
    drawMainChart(document.getElementById("total"), buildMainSeries(currentRows, key), key);
}

function render(rows){
    currentRows = rows;
    const grid=document.getElementById("grid");
    grid.innerHTML="";
    let total={gmv:0,ads:0,profit:0,ss:0};

    names.forEach(name=>{
        let r=rows
            .filter(x=>String(x.Кабинет||"").trim()==name)
            .sort((a,b)=>parseDate(a.Дата)-parseDate(b.Дата));

        let values=r.map(x=>Number(x.GMV||0));
        let g=r.reduce((a,b)=>a+Number(b.GMV||0),0);
        let ad=r.reduce((a,b)=>a+Number(b.Реклама||0),0);
        let p=r.reduce((a,b)=>a+Number(b.Прибыль||0),0);
        let s=r.reduce((a,b)=>a+Number(b.Продано_СС||0),0);

        total.gmv+=g; total.ads+=ad; total.profit+=p; total.ss+=s;

        let c=document.createElement("div");
        c.className="cab";
        c.innerHTML=`
            <div class="cab-title">${name}</div>
            <div class="chart-wrap"><canvas class="small"></canvas></div>
            <div class="bottom-stats">
                <div class="metric">GMV<b>${money(g)}</b></div>
                <div class="metric">СС<b>${money(s)}</b></div>
                <div class="metric">ДРР<b>${g?(ad/g*100).toFixed(1):0}%</b></div>
                <div class="metric">Прибыль<b>${money(p)}</b></div>
            </div>`;
        grid.appendChild(c);
        drawSmall(c.querySelector("canvas"), values);
    });

    gmv.textContent=money(total.gmv);
    ads.textContent=money(total.ads);
    profit.textContent=money(total.profit);
    ss.textContent=money(total.ss);
    drr.textContent=(total.gmv?total.ads/total.gmv*100:0).toFixed(1)+"%";

    drawMainFromSelector();
}

document.getElementById("mainMetric").addEventListener("change", drawMainFromSelector);

file.onchange=e=>{
    let r=new FileReader();
    r.onload=a=>{
        let wb=XLSX.read(a.target.result,{type:"array"});
        render(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]));
    };
    r.readAsArrayBuffer(e.target.files[0]);
};
</script>
</body>
</html>
<style>
html, body {
    height: auto !important;
    min-height: 0 !important;
    overflow-y: hidden !important;
}

body {
    padding-bottom: 0 !important;
}

.container, .dashboard, .app, .wrapper, main {
    min-height: 0 !important;
    height: auto !important;
}
</style>

<style>
/* Финальная подгонка под 1920x1200 */
.grid{
    grid-auto-rows: 250px;
}
.cab{
    height:250px;
}
</style>

<style>
html, body {
    overflow-y: auto !important;
    height: auto !important;
    min-height: 100vh !important;
}

body {
    overflow-x: hidden !important;
}

.dashboard, .container, main {
    height: auto !important;
    min-height: 0 !important;

</style>
